name: Maven service

# Builds and tests one Maven folder (pwr-*-service) and its image; publish pushes it to the
# STACKIT Container Registry. Called by ci.yml, which
# also grants the permissions: this workflow declares none, so it never gets more than its
# caller allows. Two separate jobs, so the job that pushes the image never has a cache.

on:
  workflow_call:
    inputs:
      service:
        description: Folder of the service, e.g. pwr-skill-service
        type: string
        required: true
      publish:
        description: false = check (cache, image without push), true = publish (no cache, push)
        type: boolean
        default: false
      environment:
        description: >-
          GitHub environment with the STACKIT registry (publish only): variables STACKIT_REGISTRY
          (host) and STACKIT_REGISTRY_PROJECT, secrets STACKIT_REGISTRY_USERNAME and
          STACKIT_REGISTRY_PASSWORD (robot account with push rights)
        type: string
        default: ''
    # Declared for actionlint only: the publish job reads them from its environment, which a
    # caller can't pass on (a job calling a reusable workflow can't have an environment).
    secrets:
      STACKIT_REGISTRY_USERNAME:
        required: false
      STACKIT_REGISTRY_PASSWORD:
        required: false

jobs:
  check:
    name: Build and test
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # JDK 13 from the root .java-version, as for jenv and mise locally
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: ${{ inputs.service }}/pom.xml

      # Compiles code and tests and packages the jar the image copies (target/<service>.jar)
      - name: Build
        run: ./mvnw -B package -DskipTests

      # Runs every surefire execution (in the statistics service also the heap-limit one) on
      # the classes compiled above
      - name: Test
        run: ./mvnw -B test

      # Only checks that the image builds; images are published from main
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service }}
          push: false

  publish:
    name: Build, test and publish image
    if: ${{ inputs.publish }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.service }}
    steps:
      # Fails early and clearly if the environment lacks a value (e.g. in a fork)
      - name: Check registry configuration
        working-directory: .  # before the checkout the service folder doesn't exist yet
        env:
          REGISTRY: ${{ vars.STACKIT_REGISTRY }}
          PROJECT: ${{ vars.STACKIT_REGISTRY_PROJECT }}
          HAS_USERNAME: ${{ secrets.STACKIT_REGISTRY_USERNAME != '' }}
          HAS_PASSWORD: ${{ secrets.STACKIT_REGISTRY_PASSWORD != '' }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=""
          if [ -z "$REGISTRY" ]; then missing="$missing variable STACKIT_REGISTRY,"; fi
          if [ -z "$PROJECT" ]; then missing="$missing variable STACKIT_REGISTRY_PROJECT,"; fi
          if [ "$HAS_USERNAME" != true ]; then missing="$missing secret STACKIT_REGISTRY_USERNAME,"; fi
          if [ "$HAS_PASSWORD" != true ]; then missing="$missing secret STACKIT_REGISTRY_PASSWORD,"; fi
          if [ -n "$missing" ]; then
            echo "::error::Environment '$ENVIRONMENT' lacks:${missing%,}"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No Maven cache when publishing, so no cached dependency can end up in the image
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .java-version

      # Compiles code and tests and packages the jar the image copies (target/<service>.jar)
      - name: Build
        run: ./mvnw -B package -DskipTests

      # Runs every surefire execution (in the statistics service also the heap-limit one) on
      # the classes compiled above
      - name: Test
        run: ./mvnw -B test

      - name: Log in to STACKIT Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.STACKIT_REGISTRY }}
          username: ${{ secrets.STACKIT_REGISTRY_USERNAME }}
          password: ${{ secrets.STACKIT_REGISTRY_PASSWORD }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.STACKIT_REGISTRY }}/${{ vars.STACKIT_REGISTRY_PROJECT }}/${{ inputs.service }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
