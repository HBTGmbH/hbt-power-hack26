name: Node service

# Builds one npm folder (pwr-webclient) and its image; with `publish` it pushes the image to
# the STACKIT Container Registry. Called by ci.yml, which also grants the permissions: this
# workflow declares none, so it never gets more than its caller allows.

on:
  workflow_call:
    inputs:
      service:
        description: Folder of the app, e.g. pwr-webclient
        type: string
        required: true
      publish:
        description: false = pull request (npm cache, image without push), true = no cache, push
        type: boolean
        default: false
      environment:
        description: >-
          GitHub environment with the STACKIT registry (publish only): variables STACKIT_REGISTRY
          (host) and STACKIT_REGISTRY_PROJECT, secrets STACKIT_REGISTRY_USERNAME and
          STACKIT_REGISTRY_PASSWORD (robot account with push rights)
        type: string
        default: ''
      image-tag:
        description: Tag of this commit (sha-<short sha>), pushed besides the branch name (publish only)
        type: string
        default: ''
    # Declared for actionlint only: the job reads them from its environment, which a caller
    # can't pass on (a job calling a reusable workflow can't have an environment).
    secrets:
      STACKIT_REGISTRY_USERNAME:
        required: false
      STACKIT_REGISTRY_PASSWORD:
        required: false

jobs:
  build:
    name: ${{ inputs.publish && 'Build and publish image' || 'Build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only a publishing run enters the environment and sees the registry credentials
    environment: ${{ inputs.publish && inputs.environment || '' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.service }}
    steps:
      # Fails early and clearly if the environment lacks a value (e.g. in a fork)
      - name: Check registry configuration
        if: ${{ inputs.publish }}
        working-directory: .  # before the checkout the app folder doesn't exist yet
        env:
          REGISTRY: ${{ vars.STACKIT_REGISTRY }}
          PROJECT: ${{ vars.STACKIT_REGISTRY_PROJECT }}
          HAS_USERNAME: ${{ secrets.STACKIT_REGISTRY_USERNAME != '' }}
          HAS_PASSWORD: ${{ secrets.STACKIT_REGISTRY_PASSWORD != '' }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=""
          if [ -z "$REGISTRY" ]; then missing="$missing variable STACKIT_REGISTRY,"; fi
          if [ -z "$PROJECT" ]; then missing="$missing variable STACKIT_REGISTRY_PROJECT,"; fi
          if [ "$HAS_USERNAME" != true ]; then missing="$missing secret STACKIT_REGISTRY_USERNAME,"; fi
          if [ "$HAS_PASSWORD" != true ]; then missing="$missing secret STACKIT_REGISTRY_PASSWORD,"; fi
          if [ -n "$missing" ]; then
            echo "::error::Environment '$ENVIRONMENT' lacks:${missing%,}"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node version from the folder's .nvmrc, as for fnm, nvm and mise locally. The npm cache
      # only for pull requests, so no cached package can end up in a published image.
      - name: Set up Node.js
        uses: actions/setup-node@v7  # zizmor: ignore[cache-poisoning] cache only when the image is not pushed (!inputs.publish)
        with:
          node-version-file: ${{ inputs.service }}/.nvmrc
          cache: ${{ !inputs.publish && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.service }}/package-lock.json
          package-manager-cache: ${{ !inputs.publish }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # After the build: react-scripts build empties the build folder
      - name: Write build info
        if: ${{ inputs.publish }}
        run: npm run compileInfo --if-present
        env:
          BUILD_TAG: ${{ inputs.service }}-${{ github.run_number }}

      - name: Log in to STACKIT Container Registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.STACKIT_REGISTRY }}
          username: ${{ secrets.STACKIT_REGISTRY_USERNAME }}
          password: ${{ secrets.STACKIT_REGISTRY_PASSWORD }}

      - name: Image tags and labels
        if: ${{ inputs.publish }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.STACKIT_REGISTRY }}/${{ vars.STACKIT_REGISTRY_PROJECT }}/${{ inputs.service }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ inputs.image-tag }}

      # Pull requests only check that the image builds
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service }}
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
